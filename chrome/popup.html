<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CookieSync</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="app-shell">
    <header class="app-header">
        <div class="brand">
            <img class="brand-logo" src="icon96.png" alt="">
            <div>
                <h1>CookieSync</h1>
                <p data-i18n="subtitle">Sync cookies to localhost</p>
            </div>
        </div>
        <button id="langToggle" class="language-button" type="button" aria-label="Switch language">
            <span id="langLabel">中文</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
    </header>

    <section id="statusCard" class="status-card is-ready" aria-live="polite">
        <div class="status-summary">
            <span class="status-dot" aria-hidden="true"></span>
            <div>
                <h2 id="statusTitle">Ready</h2>
                <p id="statusMeta">Not synced yet</p>
            </div>
        </div>
        <div id="statusBadge" class="status-badge" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
            <span id="statusBadgeText"></span>
        </div>
    </section>

    <p class="warning" id="warning" role="alert"></p>

    <section class="config-section" data-editor-section="host">
        <div class="section-heading">
            <div class="section-icon section-icon--source" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
            </div>
            <div class="section-copy">
                <h2 data-i18n="hostTitle">Cookie Sources</h2>
                <p data-i18n="hostDescription">Match cookies from these domains (regex supported)</p>
            </div>
            <span id="hostCount" class="count-badge" aria-label="0 patterns">0</span>
        </div>

        <div class="regex-editor regex-editor--host">
            <div id="hostLineNumbers" class="line-numbers" aria-hidden="true">1</div>
            <textarea id="regexhost" class="regexhost" rows="4" spellcheck="false" aria-label="Cookie source regular expressions"></textarea>
        </div>

        <div class="section-helper">
            <span data-i18n="onePerLine">One regular expression per line</span>
        </div>
    </section>

    <section class="config-section" data-editor-section="names">
        <div class="section-heading">
            <div class="section-icon section-icon--cookie" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M20.8 13.2A8.8 8.8 0 1 1 10.8 3a4.7 4.7 0 0 0 6.2 6.2 4.7 4.7 0 0 0 3.8 4Z"/><path d="M8.2 11h.01M11.5 16h.01M7.5 16h.01"/></svg>
            </div>
            <div class="section-copy">
                <h2 data-i18n="nameTitle">Cookie Names</h2>
                <p data-i18n="nameDescription">Only sync matching cookie names (regex supported)</p>
            </div>
            <span id="nameCount" class="count-badge" aria-label="0 patterns">0</span>
        </div>

        <div class="regex-editor regex-editor--names">
            <div id="nameLineNumbers" class="line-numbers" aria-hidden="true">1</div>
            <textarea id="regexnames" class="regexnames" rows="5" spellcheck="false" aria-label="Cookie name regular expressions"></textarea>
        </div>

        <div class="section-helper">
            <span data-i18n="onePerLine">One regular expression per line</span>
        </div>
    </section>

    <button id="syncButton" class="sync-button" type="button">
        <svg class="sync-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.8-4L3 11M3 5v6h6M4 13a8 8 0 0 0 14.8 4L21 13M21 19v-6h-6"/></svg>
        <span class="sync-button-copy">
            <span id="syncButtonLabel" class="sync-button-label">Sync Now</span>
            <span id="syncButtonSubtitle" class="sync-button-subtitle">Copy matching cookies to localhost</span>
        </span>
    </button>

    <footer class="app-footer">
        <a id="howItWorksLink" href="https://github.com/wilsonyiyi/cookiesync#how-it-works" target="_blank" rel="noreferrer">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
            <span data-i18n="howItWorks">How it works</span>
            <svg class="footer-chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </a>
        <div class="footer-meta">
            <span id="version" class="version">v1.1.0</span>
            <a id="updateLink" class="update-button" hidden target="_blank" rel="noreferrer">
                <span data-i18n="update">Update</span>
            </a>
        </div>
    </footer>
</main>

<script src="update-check.js"></script>
<script src="popup.js"></script>
</body>
</html>
