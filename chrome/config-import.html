<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CookieSync · Import configuration</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="config-import.css">
</head>
<body>
<main>
    <header><img src="icon48.png" width="28" height="28" alt=""><span>CookieSync</span></header>
    <h1 id="title">Import configuration</h1>
    <p id="hint">Choose a CookieSync configuration JSON file.</p>
    <button id="choose" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg><span id="chooseLabel">Choose JSON file</span></button>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
    <footer><span id="note">Your file stays on this device.</span><button id="close" type="button">Close</button></footer>
</main>
<script src="form-cache.js"></script>
<script src="config-import.js"></script>
<script src="config-import-page.js"></script>
</body>
</html>
