<header class="review-head"><div><h1>Cookie 管理 · 三种紧凑 Popup 布局</h1><p>固定宽度 / 600px 高度 / 列表内展开编辑 / 仅列表滚动</p></div><span class="review-note">独立交互演示 · 不读取真实 Cookie</span></header><main class="gallery" id="gallery"></main><footer class="review-foot">可操作：搜索、展开、详细属性、行内编辑与保存、删除、新增、导入导出。三个方案使用各自独立的演示数据。</footer>

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[['_ga','GA1.1.demo.1793847377',false],['FPAU','demo_visitor_128',false],['__stripe_mid','demo_stripe_id',false],['_sb_first_referrer','https://example.com',false],['session_id','demo_session_8f3a2c91',true],['_ga_XW18KGKGNR','demo_ga_value',false],['sidebar:state','expanded',false],['ph_phc_q2wUqNSr9AsKvH56PBbg9RX5dGKypQZi1gxk3cuSXJ5','demo_analytics_value',false],['_vcrr_09dcd8bd05b560f9','demo_id',false],['__cf_bm','demo_cf_value',false],['locale','zh-CN',false],['access_token','demo_token_not_real',true]].map((x,i)=>({id:i+1,name:x[0],value:x[1],sync:x[2],domain:'.example.com',path:'/',sameSite:'Lax',expiration:'2027-12-10T14:58',hostOnly:false,session:i===4,secure:true,httpOnly:x[2]}));
const configs=[{id:'a',name:'A · 分页式管理',width:400,caption:'<strong>推荐：</strong>保留现有同步入口，管理页用紧凑手风琴列表；底栏固定四项操作。',open:1,advanced:true},{id:'b',name:'B · 极简工具弹窗',width:380,caption:'<strong>更紧凑：</strong>合并标题与导航，行高 34px；为 Cookie 列表留出更多空间。',open:null,advanced:false},{id:'c',name:'C · 底部导航',width:420,caption:'<strong>操作分层：</strong>新增、导入导出放在搜索旁，底部切换同步和管理；编辑仍在行内。',open:5,advanced:false}];
const states={};
function tools(){return `<button data-action="add">${icon('plus')}新增</button><button data-action="clear">${icon('trash')}清空</button><button data-action="import">${icon('down')}导入</button><button data-action="export">${icon('up')}导出</button>`}
function nav(id){return `<button data-nav="sync">${id==='c'?icon('sync'):''}自动同步</button><button class="active" data-nav="manage">${id==='c'?icon('cookie'):''}Cookie 管理${id==='a'?'<span class="tab-count">12</span>':''}</button>`}
for(const cfg of configs){states[cfg.id]={data:structuredClone(seed),open:new Set(cfg.open?[cfg.open]:[]),advanced:new Set(cfg.advanced?[cfg.open]:[]),all:false,query:'',drafts:new Map(),dirty:new Set()};const block=document.createElement('section');block.className='proposal '+cfg.id;block.innerHTML=`<div class="proposal-heading"><strong>${cfg.name}</strong><span>${cfg.width} × 600</span></div><div class="popup" data-popup="${cfg.id}"><header class="brandbar"><span class="logo">${icon('cookie')}</span><span class="brand">CookieSync</span><span class="grow"></span>${cfg.id==='b'?'<button class="back-sync" data-nav="sync">'+icon('sync')+'自动同步</button>':'<button class="icon" data-action="settings" aria-label="设置">'+icon('settings')+'</button>'}</header>${cfg.id==='a'?'<nav class="tabs">'+nav('a')+'</nav>':''}<section class="popup-content" data-page="manage"><div class="sitebar">${icon('globe')}<span>app.example.com</span><span class="count">12 枚</span>${cfg.id==='b'?'<label class="details-toggle"><input type="checkbox" data-all>详细属性</label>':''}</div>${cfg.id==='c'?`<div class="compact-tools"><label class="searchbar">${icon('search')}<input data-search aria-label="搜索 Cookie" placeholder="搜索 Cookie 名称"></label><button class="icon add" data-action="add" aria-label="新增" title="新增">${icon('plus')}</button><button class="icon" data-action="import" aria-label="导入" title="导入">${icon('down')}</button><button class="icon" data-action="export" aria-label="导出" title="导出">${icon('up')}</button></div><div class="list-label"><label class="details-toggle"><input type="checkbox" data-all>显示详细属性</label><button data-action="clear">清空当前站点</button></div>`:`<label class="searchbar">${icon('search')}<input data-search aria-label="搜索 Cookie" placeholder="搜索 Cookie 名称">${cfg.id==='a'?'<span class="details-toggle"><input type="checkbox" data-all aria-label="显示详细属性">详情</span>':''}</label>`}<div class="list"></div>${cfg.id==='c'?'<div class="inline-notice">'+icon('sync')+'<span>2 枚 Cookie 正在自动同步 ^access_token$</textarea></label><button class="primary" data-action="sync">立即同步</button>${cfg.id==='b'?'<button data-nav="manage" style="margin-top:20px;color:#526df5">返回 Cookie 管理</button>':''}</section>${cfg.id==='c'?'<nav class="bottom-nav">'+nav('c')+'</nav>':'<div class="subfoot"><span class="status"><i></i>本地管理</span><span>当前站点 · 演示数据</span></div>'}<dialog><div class="dialog-title"><h3></h3><button class="icon" data-action="close" aria-label="关闭">${icon('close')}</button></div><div class="dialog-body"></div></dialog></div><p class="caption">${cfg.caption}</p>`;$('#gallery').append(block);render(cfg.id)}
function fields(d,id,advanced){return `<label class="field">Name<input name="name" required value="${esc(d.name)}" autocomplete="off"></label><label class="field">Value<textarea name="value" spellcheck="false">${esc(d.value)}</textarea></label><div class="more-line"><span>${d.sync?'已加入 localhost 同步':'仅当前站点'}</span><button type="button" data-more="${d.id}">${advanced?'收起属性':'详细属性'}${icon('arrow')}</button></div><div class="advanced" ${advanced?'':'hidden'}><label class="field">Domain<input name="domain" required value="${esc(d.domain)}"></label><div class="pair"><label class="field">Path<input name="path" value="${esc(d.path)}"></label><label class="field">SameSite<select name="sameSite">${['None','Strict','Lax'].map(v=>`<option ${d.sameSite===v?'selected':''}>${v}</option>`).join('')}</select></label></div><label class="field">Expiration<input type="datetime-local" name="expiration" value="${esc(d.expiration)}" ${d.session?'disabled':''}></label><div class="flags">${[['hostOnly','Host Only'],['session','Session'],['secure','Secure'],['httpOnly','HttpOnly']].map(([key,label])=>`<label><input type="checkbox" name="${key}" ${d[key]?'checked':''}>${label}</label>`).join('')}</div></div>`}
function render(id){const st=states[id],p=$(`[data-popup="${id}"]`),list=$('.list',p),pos=list.scrollTop;const filtered=st.data.filter(d=>d.name.toLowerCase().includes(st.query.toLowerCase()));list.innerHTML=filtered.map(saved=>{const d=st.drafts.get(saved.id)||saved,open=st.open.has(d.id);return `<article class="cookie ${open?'open':''}" data-id="${d.id}"><div class="rowhead"><button class="rowtoggle" aria-expanded="${open}" data-toggle="${d.id}" title="${esc(d.name)}"><span class="cookie-name">${esc(saved.name)}</span>${d.sync?'<span class="sync-dot" title="自动同步"></span>':''}<svg class="chevron"><use href="#arrow"/></svg></button><div class="row-actions">${open?`<button class="icon save" data-save="${d.id}" aria-label="保存 ${esc(saved.name)}" title="保存" ${st.dirty.has(d.id)?'':'disabled'}>${icon('save')}</button>`:''}<button class="icon del" data-delete="${d.id}" aria-label="删除 ${esc(saved.name)}" title="删除">${icon('trash')}</button></div></div><form class="editor" data-edit="${d.id}">${fields(d,id,st.all||st.advanced.has(d.id))}</form></article>`}).join('')||'<div class="empty">没有匹配的 Cookie</div>';list.scrollTop=pos;$('.count',p).textContent=filtered.length+' / '+st.data.length+' 枚';const n=$('.tab-count',p);if(n)n.textContent=st.data.length;}

function dialog(p,title,body){const d=$('dialog',p);$('h3',d).textContent=title;$('.dialog-body',d).innerHTML=body;d.showModal()}
function readForm(form,original){const f=new FormData(form);return {...original,name:String(f.get('name')||''),value:String(f.get('value')||''),domain:String(f.get('domain')||''),path:String(f.get('path')||'/'),sameSite:f.get('sameSite')||'Lax',expiration:f.get('expiration')||original.expiration,...Object.fromEntries(['hostOnly','session','secure','httpOnly'].map(k=>[k,f.has(k)]))}}
document.addEventListener('input',e=>{const p=e.target.closest('[data-popup]');if(!p)return;const id=p.dataset.popup,st=states[id];if(e.target.hasAttribute('data-search')){st.query=e.target.value;render(id);return}const form=e.target.closest('[data-edit]');if(form){const key=+form.dataset.edit,original=st.data.find(d=>d.id===key);st.drafts.set(key,readForm(form,original));st.dirty.add(key);$(`[data-save="${key}"]`,p).disabled=false;if(e.target.name==='session')$('[name="expiration"]',form).disabled=e.target.checked}});
document.addEventListener('change',e=>{if(!e.target.hasAttribute('data-all'))return;const p=e.target.closest('[data-popup]'),st=states[p.dataset.popup];st.all=e.target.checked;if(!st.all)st.advanced.clear();render(p.dataset.popup)});
document.addEventListener('submit',e=>{e.preventDefault();const p=e.target.closest('[data-popup]');if(!p)return;const st=states[p.dataset.popup];if(e.target.dataset.new!==undefined){if(!e.target.reportValidity())return;const d=readForm(e.target,{id:Date.now(),sync:false,expiration:'2027-12-10T14:58'});st.data.unshift(d);st.open.add(d.id);$('dialog',p).close();render(p.dataset.popup);$('.list',p).scrollTop=0;notify(p,'已新增演示 Cookie')}});
document.addEventListener('click',e=>{const b=e.target.closest('button'),p=b?.closest('[data-popup]');if(!p)return;const id=p.dataset.popup,st=states[id],d=b.dataset;if(d.toggle){const key=+d.toggle;st.open.has(key)?st.open.delete(key):st.open.add(key);render(id)}if(d.more){const key=+d.more;if(st.all){st.all=false;$('[data-all]',p).checked=false;st.advanced=new Set(st.open);st.advanced.delete(key)}else st.advanced.has(key)?st.advanced.delete(key):st.advanced.add(key);render(id)}if(d.save){const key=+d.save,form=$(`[data-edit="${key}"]`,p);if(!form.reportValidity())return;const next=readForm(form,st.data.find(x=>x.id===key));st.data[st.data.findIndex(x=>x.id===key)]=next;st.drafts.delete(key);st.dirty.delete(key);render(id);notify(p,'已保存演示 Cookie')}if(d.delete){const item=st.data.find(x=>x.id===+d.delete);dialog(p,'删除 Cookie',`<p>删除 <strong>${esc(item.name)}</strong>？仅影响此条演示数据。</p><div class="dialog-actions"><button data-action="close">取消</button><button class="danger-btn" data-confirm-delete="${item.id}">删除</button></div>`)}if(d.confirmDelete){st.data=st.data.filter(x=>x.id!==+d.confirmDelete);$('dialog',p).close();render(id);notify(p,'已删除演示 Cookie')}if(d.nav){$$('[data-page]',p).forEach(x=>x.classList.toggle('hidden',x.dataset.page!==d.nav));$$('[data-nav]',p).forEach(x=>x.classList.toggle('active',x.dataset.nav===d.nav));if(id==='b')$('.back-sync',p).classList.toggle('hidden',d.nav==='sync')}if(d.action==='settings')notify(p,'设置沿用现有语言、配置备份与版本入口');if(d.action==='sync')notify(p,'模拟同步完成，未操作真实 Cookie');if(d.action==='close')$('dialog',p).close();if(d.action==='add'){dialog(p,'新增 Cookie',`<form data-new>${fields({id:0,name:'',value:'',domain:'.example.com',path:'/',sameSite:'Lax',expiration:'2027-12-10T14:58',secure:true},id,true)}<div class="dialog-actions"><button type="button" data-action="close">取消</button><button class="primary" type="submit">新增</button></div></form>`);$('.more-line',p.querySelector('dialog')).remove()}if(d.action==='clear')dialog(p,'清空当前站点',`<p>将删除 app.example.com 的 ${st.data.length} 枚演示 Cookie，不影响其他站点。</p><div class="dialog-actions"><button data-action="close">取消</button><button class="danger-btn" data-action="confirm-clear">清空 ${st.data.length} 项</button></div>`);if(d.action==='confirm-clear'){st.data=[];st.drafts.clear();st.dirty.clear();$('dialog',p).close();render(id);notify(p,'当前站点演示 Cookie 已清空')}if(d.action==='export')dialog(p,'导出当前站点',`<p>${st.data.length} 枚 Cookie · JSON 格式 · 仅演示数据</p><textarea class="json" readonly aria-label="导出 JSON">${esc(JSON.stringify(st.data,null,2))}</textarea><button class="primary" data-action="download">下载 JSON</button>`);if(d.action==='download'){const blob=new Blob([$('.json',p).value],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cookies-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(d.action==='import')dialog(p,'导入 Cookie',`<p>粘贴 JSON 数组，导入当前站点演示列表。</p><textarea class="json" aria-label="导入 JSON" placeholder='[{"name":"test","value":"demo"}]'></textarea><p class="error" role="alert"></p><button class="primary" data-action="confirm-import">导入</button>`);if(d.action==='confirm-import'){try{const items=JSON.parse($('.json',p).value);if(!Array.isArray(items)||!items.length||items.some(x=>!x||typeof x.name!=='string'||typeof x.value!=='string'))throw Error('请输入包含 name、value 字符串的非空数组');items.forEach((x,i)=>st.data.push({...structuredClone(seed[0]),id:Date.now()+i,name:x.name,value:x.value,sync:false}));$('dialog',p).close();render(id);notify(p,'已导入 '+items.length+' 枚演示 Cookie')}catch(err){$('.error',p).textContent=err.message}}});
</script></body></html>
