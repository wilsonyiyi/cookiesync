const seed=[['_ga','GA1.1.demo.1793847377',false],['FPAU','demo_visitor_128',false],['__stripe_mid','demo_stripe_id',false],['_sb_first_referrer','https://example.com',false],['session_id','demo_session_8f3a2c91',true],['_ga_XW18KGKGNR','demo_ga_value',false],['sidebar:state','expanded',false],['ph_phc_q2wUqNSr9AsKvH56PBbg9RX5dGKypQZi1gxk3cuSXJ5','demo_analytics_value',false],['_vcrr_09dcd8bd05b560f9','demo_id',false],['__cf_bm','demo_cf_value',false],['locale','zh-CN',false],['access_token','demo_token_not_real',true]].map((x,i)=>({id:i+1,name:x[0],value:x[1],sync:x[2],domain:'.example.com',path:'/',sameSite:'Lax',expiration:'2027-12-10T14:58',hostOnly:false,session:i===4,secure:true,httpOnly:x[2]}));
const configs=[{id:'a',name:'同步优先 · 顶部次级入口',width:400,caption:'首页默认展示同步，管理页不占用首页内容空间。',open:null,advanced:false}];
const states={};let selectSerial=0;
function tools(){return `<button data-action="add">${icon('plus')}新增</button><button data-action="clear">${icon('trash')}清空</button><button data-action="import">${icon('down')}导入</button><button data-action="export">${icon('up')}导出</button>`}
function nav(id){return `<button data-nav="sync">${id==='c'?icon('sync'):''}自动同步</button><button class="active" data-nav="manage">${id==='c'?icon('cookie'):''}Cookie 管理${id==='a'?'<span class="tab-count">12</span>':''}</button>`}
for(const cfg of configs){states[cfg.id]={data:structuredClone(seed),open:new Set(),advanced:new Set(),all:false,query:'',drafts:new Map(),dirty:new Set()};const block=document.createElement('section');block.className='proposal '+cfg.id;block.innerHTML=`<div class="proposal-heading"><strong>${cfg.name}</strong><span>400 × 600</span></div><div class="popup" data-popup="a">
<header class="brandbar" data-page="sync"><span class="logo">${icon('cookie')}</span><div class="brand-copy"><span class="brand">CookieSync</span><small>同步远程 Cookie 到 localhost</small></div><span class="grow"></span><button class="manage-entry" data-nav="manage">${icon('cookie')}Cookie 管理</button><button class="icon" data-action="settings" aria-label="设置" title="设置">${icon('settings')}</button></header>
<header class="manage-header hidden" data-page="manage"><button class="back" data-nav="sync" aria-label="返回同步">${icon('arrow')}同步</button><span class="head-divider"></span><strong>Cookie 管理</strong><span class="sync-state"><i></i>自动同步中</span></header>
<section class="home" data-page="sync"><div class="status-card"><span class="status-light"></span><div class="status-copy"><strong>自动同步运行中</strong><p>最近同步于 14:32 · 一切正常</p></div><span class="success-count">2 个已同步</span></div>
<section class="config-block"><div class="config-title"><span class="section-icon">${icon('globe')}</span><div><h2>Cookie 来源</h2><p>匹配需要同步的远程站点</p></div><span class="count-tag">2</span></div><div class="regexbox"><div class="gutter" aria-hidden="true">1<br>2<br>3</div><textarea aria-label="Cookie 来源正则" spellcheck="false">^app\\.example\\.com$
^auth\\.example\\.com$</textarea></div><div class="config-helper"><span>支持正则表达式，每行一条</span><span>自动保存</span></div></section>
<section class="config-block"><div class="config-title"><span class="section-icon">${icon('cookie')}</span><div><h2>Cookie 名称</h2><p>仅同步匹配名称的 Cookie</p></div><span class="count-tag">2</span></div><div class="regexbox"><div class="gutter" aria-hidden="true">1<br>2<br>3</div><textarea aria-label="Cookie 名称正则" spellcheck="false">^session_id$
^access_token$</textarea></div><div class="config-helper"><span>支持正则表达式，每行一条</span><span>自动保存</span></div></section>
<button class="sync-main" data-action="sync"><span>${icon('sync')}立即同步</span><small>将匹配的 Cookie 复制到 http://localhost</small></button><div class="home-bottom"><span>本地处理 · 无云端上传</span><button data-action="settings">v1.5.3</button></div></section>
<section class="popup-content hidden" data-page="manage"><label class="searchbar">${icon('search')}<input data-search aria-label="搜索 Cookie" placeholder="搜索 Cookie 名称"><span class="details-toggle"><input type="checkbox" data-all aria-label="显示详细属性">详情</span></label><div class="list"></div><footer class="footer">${tools()}</footer><div class="subfoot"><span class="status"><i></i>当前站点</span><span>管理操作不会关闭自动同步</span></div></section>
<dialog><div class="dialog-title"><h3></h3><button class="icon" data-action="close" aria-label="关闭">${icon('close')}</button></div><div class="dialog-body"></div></dialog></div><p class="caption">${cfg.caption}</p>`;$('#gallery').append(block);render(cfg.id)}

function selectControl(name,value,options,label){const uid='menu-'+(++selectSerial);return `<div class="custom-select"><input type="hidden" name="${name}" value="${esc(value)}"><button type="button" class="select-trigger" aria-label="${label}" aria-haspopup="listbox" aria-expanded="false" aria-controls="${uid}"><span>${esc(value)}</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button><div class="select-menu" id="${uid}" role="listbox" aria-label="${label}" hidden>${options.map(v=>`<button type="button" role="option" tabindex="-1" aria-selected="${v===value}" data-option="${esc(v)}"><span>${esc(v)}</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></svg></button>`).join('')}</div></div>`}
function fields(d,id,advanced){return `<label class="field">Name<input name="name" required value="${esc(d.name)}" autocomplete="off"></label><label class="field">Value<textarea name="value" spellcheck="false">${esc(d.value)}</textarea></label><div class="more-line"><span>${d.sync?'已加入 localhost 同步':'仅当前站点'}</span><button type="button" data-more="${d.id}">${advanced?'收起属性':'详细属性'}${icon('arrow')}</button></div><div class="advanced" ${advanced?'':'hidden'}><label class="field">Domain<input name="domain" required value="${esc(d.domain)}"></label><div class="pair"><label class="field">Path<input name="path" value="${esc(d.path)}"></label><div class="field"><span>SameSite</span>${selectControl('sameSite',d.sameSite,['None','Strict','Lax'],'SameSite')}</div></div><label class="field">Expiration<span class="date-control"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 11h18"/></svg><input type="text" name="expiration" aria-label="过期时间，格式为年-月-日 时:分" placeholder="YYYY-MM-DD HH:mm" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}" value="${esc(d.expiration.replace('T',' '))}" ${d.session?'disabled':''}></span></label><div class="flags">${[['hostOnly','Host Only'],['session','Session'],['secure','Secure'],['httpOnly','HttpOnly']].map(([key,label])=>`<label><input type="checkbox" name="${key}" ${d[key]?'checked':''}>${label}</label>`).join('')}</div></div>`}
function render(id){const st=states[id],p=$(`[data-popup="${id}"]`),list=$('.list',p),pos=list.scrollTop;const filtered=st.data.filter(d=>d.name.toLowerCase().includes(st.query.toLowerCase()));list.innerHTML=filtered.map(saved=>{const d=st.drafts.get(saved.id)||saved,open=st.open.has(d.id);return `<article class="cookie ${open?'open':''}" data-id="${d.id}"><div class="rowhead"><button class="rowtoggle" aria-expanded="${open}" data-toggle="${d.id}" title="${esc(d.name)}"><span class="cookie-name">${esc(saved.name)}</span>${d.sync?'<span class="sync-dot" title="自动同步"></span>':''}<svg class="chevron"><use href="#arrow"/></svg></button><div class="row-actions">${open?`<button class="icon save" data-save="${d.id}" aria-label="保存 ${esc(saved.name)}" title="保存" ${st.dirty.has(d.id)?'':'disabled'}>${icon('save')}</button>`:''}<button class="icon del" data-delete="${d.id}" aria-label="删除 ${esc(saved.name)}" title="删除">${icon('trash')}</button></div></div><form class="editor" data-edit="${d.id}">${fields(d,id,st.all||st.advanced.has(d.id))}</form></article>`}).join('')||'<div class="empty">没有匹配的 Cookie</div>';list.scrollTop=pos;const n=$('.tab-count',p);if(n)n.textContent=st.data.length;}
function notify(p,text){$('.popup-message',p)?.remove();const t=document.createElement('div');t.className='popup-message';t.setAttribute('role','status');t.textContent=text;p.append(t);setTimeout(()=>t.remove(),2600)}
function dialog(p,title,body){const d=$('dialog',p);$('h3',d).textContent=title;$('.dialog-body',d).innerHTML=body;d.showModal()}
function readForm(form,original){const f=new FormData(form);return {...original,name:String(f.get('name')||''),value:String(f.get('value')||''),domain:String(f.get('domain')||''),path:String(f.get('path')||'/'),sameSite:f.get('sameSite')||'Lax',expiration:f.get('expiration')?String(f.get('expiration')).replace(' ','T'):original.expiration,...Object.fromEntries(['hostOnly','session','secure','httpOnly'].map(k=>[k,f.has(k)]))}}
document.addEventListener('input',e=>{const p=e.target.closest('[data-popup]');if(!p)return;const id=p.dataset.popup,st=states[id];if(e.target.hasAttribute('data-search')){st.query=e.target.value;render(id);return}const form=e.target.closest('[data-edit]');if(form){const key=+form.dataset.edit,original=st.data.find(d=>d.id===key);st.drafts.set(key,readForm(form,original));st.dirty.add(key);$(`[data-save="${key}"]`,p).disabled=false;if(e.target.name==='session')$('[name="expiration"]',form).disabled=e.target.checked}});
document.addEventListener('input',e=>{if(e.target.closest('.regexbox')){const section=e.target.closest('.config-block');$('.count-tag',section).textContent=e.target.value.split('\n').filter(x=>x.trim()).length}});
document.addEventListener('change',e=>{if(!e.target.hasAttribute('data-all'))return;const p=e.target.closest('[data-popup]'),st=states[p.dataset.popup];st.all=e.target.checked;if(!st.all)st.advanced.clear();render(p.dataset.popup)});
document.addEventListener('submit',e=>{e.preventDefault();const p=e.target.closest('[data-popup]');if(!p)return;const st=states[p.dataset.popup];if(e.target.dataset.new!==undefined){if(!e.target.reportValidity())return;const d=readForm(e.target,{id:Date.now(),sync:false,expiration:'2027-12-10T14:58'});st.data.unshift(d);st.open.add(d.id);$('dialog',p).close();render(p.dataset.popup);$('.list',p).scrollTop=0;notify(p,'已新增演示 Cookie')}});
document.addEventListener('click',e=>{const b=e.target.closest('button'),p=b?.closest('[data-popup]');if(!p)return;const id=p.dataset.popup,st=states[id],d=b.dataset;if(d.toggle){const key=+d.toggle;st.open.has(key)?st.open.delete(key):st.open.add(key);render(id)}if(d.more){const key=+d.more;if(st.all){st.all=false;$('[data-all]',p).checked=false;st.advanced=new Set(st.open);st.advanced.delete(key)}else st.advanced.has(key)?st.advanced.delete(key):st.advanced.add(key);render(id)}if(d.save){const key=+d.save,form=$(`[data-edit="${key}"]`,p);if(!form.reportValidity())return;const next=readForm(form,st.data.find(x=>x.id===key));st.data[st.data.findIndex(x=>x.id===key)]=next;st.drafts.delete(key);st.dirty.delete(key);render(id);notify(p,'已保存演示 Cookie')}if(d.delete){const item=st.data.find(x=>x.id===+d.delete);dialog(p,'删除 Cookie',`<p>删除 <strong>${esc(item.name)}</strong>？仅影响此条演示数据。</p><div class="dialog-actions"><button data-action="close">取消</button><button class="danger-btn" data-confirm-delete="${item.id}">删除</button></div>`)}if(d.confirmDelete){st.data=st.data.filter(x=>x.id!==+d.confirmDelete);$('dialog',p).close();render(id);notify(p,'已删除演示 Cookie')}if(d.nav){$$('[data-page]',p).forEach(x=>x.classList.toggle('hidden',x.dataset.page!==d.nav));$$('[data-nav]',p).forEach(x=>x.classList.toggle('active',x.dataset.nav===d.nav));if(id==='b')$('.back-sync',p).classList.toggle('hidden',d.nav==='sync')}if(d.action==='settings')dialog(p,'设置',`<div class="settings-body"><div class="setting-row"><span>语言</span>${selectControl('language','简体中文',['简体中文','English'],'语言')}</div><div class="setting-row"><span>配置备份</span><span>导入 / 导出</span></div><div class="setting-row"><span>CookieSync</span><span>v1.5.3</span></div><p>这是设置入口预览，完整设置沿用现有插件。</p></div>`);if(d.action==='sync'){$('.status-copy p',p).textContent='刚刚同步 · 2 个 Cookie 已更新';notify(p,'演示同步完成 · 未操作真实 Cookie')};if(d.action==='close')$('dialog',p).close();if(d.action==='add'){dialog(p,'新增 Cookie',`<form data-new>${fields({id:0,name:'',value:'',domain:'.example.com',path:'/',sameSite:'Lax',expiration:'2027-12-10T14:58',secure:true},id,true)}<div class="dialog-actions"><button type="button" data-action="close">取消</button><button class="primary" type="submit">新增</button></div></form>`);$('.more-line',p.querySelector('dialog')).remove()}if(d.action==='clear')dialog(p,'清空当前站点',`<p>将删除 app.example.com 的 ${st.data.length} 个演示 Cookie，不影响其他站点。</p><div class="dialog-actions"><button data-action="close">取消</button><button class="danger-btn" data-action="confirm-clear">清空 ${st.data.length} 项</button></div>`);if(d.action==='confirm-clear'){st.data=[];st.drafts.clear();st.dirty.clear();$('dialog',p).close();render(id);notify(p,'当前站点演示 Cookie 已清空')}if(d.action==='export')dialog(p,'导出当前站点',`<p>${st.data.length} 个 Cookie · JSON 格式 · 仅演示数据</p><textarea class="json" readonly aria-label="导出 JSON">${esc(JSON.stringify(st.data,null,2))}</textarea><button class="primary" data-action="download">下载 JSON</button>`);if(d.action==='download'){const blob=new Blob([$('.json',p).value],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cookies-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(d.action==='import')dialog(p,'导入 Cookie',`<p>粘贴 JSON 数组，导入当前站点演示列表。</p><textarea class="json" aria-label="导入 JSON" placeholder='[{"name":"test","value":"demo"}]'></textarea><p class="error" role="alert"></p><button class="primary" data-action="confirm-import">导入</button>`);if(d.action==='confirm-import'){try{const items=JSON.parse($('.json',p).value);if(!Array.isArray(items)||!items.length||items.some(x=>!x||typeof x.name!=='string'||typeof x.value!=='string'))throw Error('请输入包含 name、value 字符串的非空数组');items.forEach((x,i)=>st.data.push({...structuredClone(seed[0]),id:Date.now()+i,name:x.name,value:x.value,sync:false}));$('dialog',p).close();render(id);notify(p,'已导入 '+items.length+' 个演示 Cookie')}catch(err){$('.error',p).textContent=err.message}}});

function closeSelects(except){$$('.custom-select').forEach(c=>{if(c===except)return;$('.select-menu',c).hidden=true;$('.select-trigger',c).setAttribute('aria-expanded','false')})}
document.addEventListener('click',e=>{const trigger=e.target.closest('.select-trigger'),option=e.target.closest('[data-option]');if(trigger){const c=trigger.closest('.custom-select'),menu=$('.select-menu',c),opening=menu.hidden;closeSelects();menu.hidden=!opening;trigger.setAttribute('aria-expanded',String(opening));if(opening)$('[aria-selected="true"]',menu)?.focus();return}if(option){const c=option.closest('.custom-select'),input=$('input',c),t=$('.select-trigger',c);input.value=option.dataset.option;$('span',t).textContent=input.value;$$('[role=option]',c).forEach(o=>o.setAttribute('aria-selected',String(o===option)));closeSelects();t.focus();input.dispatchEvent(new Event('input',{bubbles:true}));return}closeSelects()});
document.addEventListener('keydown',e=>{const c=e.target.closest('.custom-select');if(!c)return;const t=$('.select-trigger',c),menu=$('.select-menu',c),options=$$('[role=option]',c);if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeSelects();t.focus()}if(e.key==='Tab')closeSelects();if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();if(menu.hidden){closeSelects(c);menu.hidden=false;t.setAttribute('aria-expanded','true')}let i=options.indexOf(document.activeElement);i=e.key==='Home'?0:e.key==='End'?options.length-1:(i+(e.key==='ArrowDown'?1:options.length-1)+options.length)%options.length;options[i].focus()}});
</script></body></html>
